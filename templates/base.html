{% load static %}
<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Faculty Attendance SaaS{% endblock %}</title>
    <!-- Google Fonts Inter & SF Pro fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/dist/styles.css' %}">
    <style>
        :root {
            --apple-canvas: #f5f5f7;
            --apple-surface: #ffffff;
            --apple-ink: #1d1d1f;
            --apple-muted: #86868b;
            --apple-blue: #0066cc;
            --apple-blue-hover: #0071e3;
            --apple-hairline: #e0e0e0;
        }
        *, ::before, ::after {
            box-sizing: border-box;
        }
        html, body {
            overflow-x: hidden;
            width: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", sans-serif;
            background-color: var(--apple-canvas);
            color: var(--apple-ink);
            letter-spacing: -0.01em;
        }
        .apple-card {
            background-color: var(--apple-surface);
            border: 1px solid var(--apple-hairline);
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-btn-primary {
            background-color: var(--apple-blue);
            color: #ffffff;
            font-weight: 500;
            border-radius: 980px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-btn-primary:hover {
            background-color: var(--apple-blue-hover);
            transform: scale(1.01);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-[#f5f5f7] text-[#1d1d1f] min-h-screen flex flex-col antialiased overflow-x-hidden w-full">
    <!-- Apple Translucent Header Navigation -->
    {% include "components/navbar.html" %}

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 box-border overflow-x-hidden">
        {% include "components/alerts.html" %}
        {% block content %}{% endblock %}
    </main>

    <!-- Page Footer -->
    {% include "components/footer.html" %}

    <!-- Mobile Menu Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            if (btn && menu) {
                btn.addEventListener('click', function () {
                    menu.classList.toggle('hidden');
                });
            }
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
