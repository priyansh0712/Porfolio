[project]
name = "studenterp1"
version = "1.0.0"
description = "School Faculty Face Attendance SaaS Platform"
requires-python = ">=3.12"

dependencies = [
    "Django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "argon2-cffi>=23.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

