{% if messages %}
    <div class="mb-6 space-y-3">
        {% for message in messages %}
            <div class="p-4 rounded-lg border text-sm flex justify-between items-center {% if message.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% elif message.tags == 'success' %}bg-green-50 border-green-200 text-green-800{% elif message.tags == 'warning' %}bg-yellow-50 border-yellow-200 text-yellow-800{% else %}bg-blue-50 border-blue-200 text-blue-800{% endif %}" role="alert">
                <div>{{ message }}</div>
                <button type="button" class="ml-4 font-bold opacity-70 hover:opacity-100" onclick="this.parentElement.remove();">&times;</button>
            </div>
        {% endfor %}
    </div>
{% endif %}
