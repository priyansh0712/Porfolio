<header class="bg-white/90 backdrop-blur-xl border-b border-[var(--apple-hairline)] sticky top-0 z-50 transition-all duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl theme-bg-accent flex items-center justify-center text-white font-semibold text-base shadow-sm">
                    S
                </div>
                <a href="{% url 'public:landing' %}" class="text-base font-bold text-[var(--apple-ink)] tracking-tight hover:opacity-80 transition-opacity">
                    StudentERP <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white text-[var(--apple-blue)] border border-[var(--apple-hairline)] shadow-sm">Biometric</span>
                </a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center space-x-6">
                <a href="{% url 'public:landing' %}#features" class="text-xs font-semibold text-[var(--apple-ink)]/80 hover:text-[var(--apple-blue)] transition-colors">Features</a>
                <a href="{% url 'public:landing' %}#pricing" class="text-xs font-semibold text-[var(--apple-ink)]/80 hover:text-[var(--apple-blue)] transition-colors">Pricing</a>
                <a href="{% url 'public:register' %}" class="inline-flex items-center text-xs font-semibold text-white apple-btn-primary px-5 py-2 transition-all shadow-sm">
                    Register School
                </a>
            </nav>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button type="button" id="mobile-menu-btn" class="text-[var(--apple-ink)] hover:text-[var(--apple-blue)] p-2 rounded-lg focus:outline-none" aria-label="Toggle menu">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-[var(--apple-hairline)] bg-white px-4 pt-3 pb-5 space-y-3 shadow-lg">
        <a href="{% url 'public:landing' %}#features" class="block px-3 py-2 text-sm font-medium text-[var(--apple-ink)] rounded-xl hover:bg-[var(--apple-canvas)]">Features</a>
        <a href="{% url 'public:landing' %}#pricing" class="block px-3 py-2 text-sm font-medium text-[var(--apple-ink)] rounded-xl hover:bg-[var(--apple-canvas)]">Pricing</a>
        <a href="{% url 'public:register' %}" class="block text-center px-4 py-2.5 text-sm font-medium text-white apple-btn-primary shadow-sm">Register School</a>
    </div>
</header>
