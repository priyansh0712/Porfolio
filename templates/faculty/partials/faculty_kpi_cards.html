<!-- 3 Apple-Grade Minimalist KPI Cards for Faculty Directory -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-4" id="faculty-kpi-grid">

    <!-- 1. Total Faculty Card -->
    <div class="apple-card p-4 flex items-start justify-between gap-3 hover:border-[#0066cc]/30 hover:shadow-xs transition-all group bg-white">
        <!-- Content (Left) -->
        <div class="min-w-0 flex-1">
            <span class="text-xs font-semibold text-gray-500 tracking-wide block truncate">
                Total Faculty
            </span>
            <div class="text-2xl font-bold text-[#1D1D1F] tracking-tight leading-tight my-1 truncate">
                {{ total_count }}
            </div>
            <div class="text-[11px] text-gray-500 truncate mt-0.5">
                {{ active_count }} Active Staff
            </div>
        </div>
        <!-- Icon Badge (Top-Right) -->
        <div class="w-10 h-10 rounded-2xl bg-[#0066cc]/8 text-[#0066cc] flex items-center justify-center flex-shrink-0 group-hover:bg-[#0066cc]/14 group-hover:scale-105 transition-all">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        </div>
    </div>

    <!-- 2. Academic Departments Card -->
    <div class="apple-card p-4 flex items-start justify-between gap-3 hover:border-[#8b5cf6]/30 hover:shadow-xs transition-all group bg-white">
        <!-- Content (Left) -->
        <div class="min-w-0 flex-1">
            <span class="text-xs font-semibold text-gray-500 tracking-wide block truncate">
                Departments
            </span>
            <div class="text-2xl font-bold text-[#1D1D1F] tracking-tight leading-tight my-1 truncate">
                {{ departments_count }}
            </div>
            <div class="text-[11px] text-gray-500 truncate mt-0.5">
                Academic Departments
            </div>
        </div>
        <!-- Icon Badge (Top-Right) -->
        <div class="w-10 h-10 rounded-2xl bg-[#8b5cf6]/8 text-[#8b5cf6] flex items-center justify-center flex-shrink-0 group-hover:bg-[#8b5cf6]/14 group-hover:scale-105 transition-all">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M8 10h.01"/><path d="M16 10h.01"/><path d="M8 14h.01"/><path d="M16 14h.01"/>
            </svg>
        </div>
    </div>

    <!-- 3. Class Teachers Assigned Card -->
    <div class="apple-card p-4 flex items-start justify-between gap-3 hover:border-[#10b981]/30 hover:shadow-xs transition-all group bg-white">
        <!-- Content (Left) -->
        <div class="min-w-0 flex-1">
            <span class="text-xs font-semibold text-gray-500 tracking-wide block truncate">
                Class Teachers
            </span>
            <div class="text-2xl font-bold text-[#1D1D1F] tracking-tight leading-tight my-1 truncate">
                {{ assigned_class_teachers_count }} <span class="text-xs font-semibold text-gray-400">/ {{ total_divisions_count }}</span>
            </div>
            <div class="text-[11px] text-gray-500 truncate mt-0.5">
                Divisions Covered
            </div>
        </div>
        <!-- Icon Badge (Top-Right) -->
        <div class="w-10 h-10 rounded-2xl bg-[#10b981]/8 text-[#10b981] flex items-center justify-center flex-shrink-0 group-hover:bg-[#10b981]/14 group-hover:scale-105 transition-all">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>

</div>
