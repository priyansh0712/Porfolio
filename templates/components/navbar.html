<header class="bg-white/90 backdrop-blur-xl border-b border-[#e0e0e0] sticky top-0 z-50 transition-all duration-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-[#0066cc] flex items-center justify-center text-white font-semibold text-base shadow-sm">
                    S
                </div>
                <a href="{% url 'public:landing' %}" class="text-base font-semibold text-[#1d1d1f] tracking-tight hover:opacity-80 transition-opacity">
                    StudentERP <span class="text-[11px] font-medium px-2 py-0.5 rounded-full bg-[#f5f5f7] text-[#0066cc] border border-[#e0e0e0]">Biometric</span>
                </a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex items-center space-x-6">
                {% if user.is_authenticated and user.role == 'SCHOOL_ADMIN' %}
                    <a href="{% url 'reports:dashboard' %}" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Dashboard</a>
                    <a href="{% url 'faculty:list' %}" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Faculty</a>
                    <a href="{% url 'reports:report-list' %}" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Reports</a>
                    <a href="{% url 'schedules:settings' %}" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Schedules</a>
                    <a href="{% url 'attendance:kiosk' %}" target="_blank" class="inline-flex items-center text-xs font-medium text-white bg-[#0066cc] hover:bg-[#0071e3] rounded-full px-4 py-2 transition-all shadow-sm">
                        📷 Kiosk
                    </a>
                {% else %}
                    <a href="{% url 'public:landing' %}#features" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Features</a>
                    <a href="{% url 'public:landing' %}#security" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Biometric Security</a>
                    <a href="{% url 'public:landing' %}#pricing" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">Pricing</a>
                    <a href="{% url 'public:landing' %}#faq" class="text-xs font-medium text-[#1d1d1f]/80 hover:text-[#0066cc] transition-colors">FAQ</a>
                    <a href="{% url 'public:register' %}" class="inline-flex items-center text-xs font-medium text-white bg-[#0066cc] hover:bg-[#0071e3] rounded-full px-4 py-2 transition-all shadow-sm transform hover:scale-[1.02]">
                        Register School
                    </a>
                {% endif %}
            </nav>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button type="button" id="mobile-menu-btn" class="text-[#1d1d1f] hover:text-[#0066cc] p-2 rounded-lg focus:outline-none" aria-label="Toggle menu">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-[#e0e0e0] bg-white px-4 pt-3 pb-5 space-y-3 shadow-lg">
        <a href="{% url 'public:landing' %}#features" class="block px-3 py-2 text-sm font-medium text-[#1d1d1f] rounded-xl hover:bg-[#f5f5f7]">Features</a>
        <a href="{% url 'public:landing' %}#security" class="block px-3 py-2 text-sm font-medium text-[#1d1d1f] rounded-xl hover:bg-[#f5f5f7]">Biometric Security</a>
        <a href="{% url 'public:landing' %}#pricing" class="block px-3 py-2 text-sm font-medium text-[#1d1d1f] rounded-xl hover:bg-[#f5f5f7]">Pricing</a>
        <a href="{% url 'public:landing' %}#faq" class="block px-3 py-2 text-sm font-medium text-[#1d1d1f] rounded-xl hover:bg-[#f5f5f7]">FAQ</a>
        <a href="{% url 'public:register' %}" class="block text-center px-4 py-2.5 text-sm font-medium text-white bg-[#0066cc] rounded-full shadow-sm">Register School</a>
    </div>
</header>
