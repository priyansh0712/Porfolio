<header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-700 to-purple-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-500/20">
                    S
                </div>
                <a href="{% url 'public:landing' %}" class="text-lg font-bold bg-gradient-to-r from-gray-900 via-indigo-950 to-gray-800 bg-clip-text text-transparent tracking-tight">
                    StudentERP <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200/50">Biometric</span>
                </a>
            </div>

            <!-- Desktop Nav Links -->
            <nav class="hidden md:flex space-x-8 items-center">
                <a href="{% url 'public:landing' %}#features" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Features</a>
                <a href="{% url 'public:landing' %}#security" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Biometric Security</a>
                <a href="{% url 'public:landing' %}#pricing" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">Pricing</a>
                <a href="{% url 'public:landing' %}#faq" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition-colors">FAQ</a>
                <a href="{% url 'public:register' %}" class="inline-flex items-center text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg px-4 py-2.5 shadow-md shadow-indigo-500/20 hover:shadow-indigo-500/30 transition-all transform hover:-translate-y-0.5">
                    Register School
                </a>
            </nav>

            <!-- Mobile menu button -->
            <div class="md:hidden flex items-center">
                <button type="button" id="mobile-menu-btn" class="text-gray-600 hover:text-gray-900 p-2 rounded-lg focus:outline-none" aria-label="Toggle menu">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation Drawer -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-gray-100 bg-white px-4 pt-3 pb-5 space-y-3 shadow-lg">
        <a href="{% url 'public:landing' %}#features" class="block px-3 py-2 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-50">Features</a>
        <a href="{% url 'public:landing' %}#security" class="block px-3 py-2 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-50">Biometric Security</a>
        <a href="{% url 'public:landing' %}#pricing" class="block px-3 py-2 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-50">Pricing</a>
        <a href="{% url 'public:landing' %}#faq" class="block px-3 py-2 text-base font-medium text-gray-700 rounded-lg hover:bg-gray-50">FAQ</a>
        <a href="{% url 'public:register' %}" class="block text-center px-4 py-2.5 text-base font-semibold text-white bg-indigo-600 rounded-lg shadow">Register School</a>
    </div>
</header>
