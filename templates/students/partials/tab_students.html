<!-- Students Tab: Clean Search bar + filters + responsive table -->

<!-- 3 Dynamic KPI Cards Container -->
<div id="students-kpi-container">
    {% include 'students/partials/student_kpi_cards.html' %}
</div>

<!-- Clean Apple Filter Toolbar (Shared Design System with Faculty) -->
<form method="GET" id="student-filter-form" action="{% url 'students:hub' %}" onsubmit="event.preventDefault(); triggerLiveStudentFilter();">
    <input type="hidden" name="tab" value="students">
    <input type="hidden" name="status" id="student-filter-status" value="{{ status_filter|default:'active' }}">

    <div class="filter-toolbar">
        <!-- Search Input -->
        <div class="search-input-wrapper" style="position: relative;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" name="q" class="search-input" id="student-search-input" value="{{ search }}" placeholder="Search by name, GR No, or roll..." autocomplete="off" style="padding-right: 32px;">
            <button type="button" id="student-clear-search-btn" onclick="clearStudentSearch()"
                style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; border: none; background: transparent; padding: 0; {% if not search %}display: none;{% else %}display: flex;{% endif %} align-items: center; justify-content: center;"
                title="Clear search">
                <span class="w-5 h-5 flex items-center justify-center rounded-full hover:bg-gray-200 text-[10px] font-bold" style="background-color: #f3f4f6; color: #6b7280;">✕</span>
            </button>
        </div>

        {% if is_admin %}
        <!-- Standard Dropdown -->
        <select name="standard" class="filter-select" id="student-filter-standard" onchange="handleStandardFilterChange(this)">
            <option value="">All Standards</option>
            {% for s in standards %}
            <option value="{{ s.id }}" {% if request.GET.standard == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>

        <!-- Division Dropdown -->
        <select name="division" class="filter-select" id="student-filter-division">
            <option value="">All Divisions</option>
            {% for d in divisions %}
            <option value="{{ d.id }}" data-standard="{{ d.standard_id }}" data-name="{{ d.name }}" data-fullname="{{ d.standard.name }} — {{ d.name }}" {% if request.GET.division == d.id|stringformat:"s" %}selected{% endif %}>
                {% if request.GET.standard == d.standard_id|stringformat:"s" %}Division {{ d.name }}{% else %}{{ d.standard.name }} — {{ d.name }}{% endif %}
            </option>
            {% endfor %}
        </select>
        {% endif %}

        <!-- Status Pills (Clean Minimal Apple Segmented Control) -->
        <div class="status-pills">
            <button type="button" class="status-pill {% if status_filter == 'all' %}active{% endif %}" data-filter="all" onclick="setStudentStatusFilter('all', this)">All</button>
            <button type="button" class="status-pill {% if status_filter == 'active' or not status_filter and not show_inactive %}active{% endif %}" data-filter="active" onclick="setStudentStatusFilter('active', this)">Active</button>
            <button type="button" class="status-pill {% if status_filter == 'inactive' or show_inactive %}active{% endif %}" data-filter="inactive" onclick="setStudentStatusFilter('inactive', this)">Inactive</button>
        </div>

        <!-- Action Buttons (Select + Clear) -->
        <div class="toolbar-actions-group flex items-center gap-2">
            {% if can_edit_students %}
            <!-- Select Mode Toggle -->
            <button type="button" id="toggle-select-mode-btn" onclick="toggleStudentSelectionMode()"
                style="padding: 5px 14px; border-radius: 8px; border: 1px solid #e0e0e0; background: #f5f5f7; font-size: 0.72rem; font-weight: 600; color: #1d1d1f; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap;"
                class="hover:bg-white hover:border-gray-300">
                <svg id="toggle-select-mode-icon" class="w-3.5 h-3.5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <rect width="18" height="18" x="3" y="3" rx="4" stroke-width="2"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 12 2 2 4-4"/>
                </svg>
                <span id="toggle-select-mode-text">Select</span>
            </button>
            {% endif %}

            <!-- Clear Filters Button -->
            <button type="button" id="student-reset-btn" onclick="resetStudentFilters()"
                style="{% if not search and not request.GET.standard and not request.GET.division and status_filter != 'inactive' and status_filter != 'all' and not show_inactive %}display: none;{% else %}display: inline-flex;{% endif %} padding: 5px 12px; border-radius: 8px; border: 1px solid #e0e0e0; background: #f5f5f7; font-size: 0.72rem; font-weight: 600; color: #86868b; cursor: pointer; transition: all 0.2s; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;"
                class="hover:bg-white hover:text-rose-600 hover:border-rose-200"
                title="Reset all filters">
                <svg class="w-3.5 h-3.5 text-inherit" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span>Clear</span>
            </button>
        </div>
    </div>
</form>

<!-- Floating Bulk Action Capsule Bar (Sticky at bottom when items are selected) -->
{% if can_edit_students %}
<div id="student-bulk-action-bar"
    style="background-color: #1d1d1f !important; color: #ffffff !important; box-shadow: 0 20px 45px rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.15) !important;"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 rounded-full px-5 py-2.5 flex items-center gap-4 transition-all duration-300 transform translate-y-24 opacity-0 pointer-events-none max-w-[calc(100vw-32px)] overflow-x-auto">
    
    <!-- Count Badge -->
    <div class="flex items-center gap-2 pl-1 pr-3 border-r border-white/20 whitespace-nowrap">
        <span class="w-2 h-2 rounded-full bg-[#0066cc] animate-pulse"></span>
        <span id="bulk-selected-count-label" class="text-xs font-bold font-mono tracking-tight text-white">0 selected</span>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2.5">
        <!-- 1A. Activate / Restore (When selected students are Inactive) -->
        <button type="button" id="bulk-btn-restore" onclick="openBulkRestoreModal()"
            style="background-color: #16a34a !important; color: #ffffff !important; display: none;"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold hover:opacity-90 transition-all cursor-pointer whitespace-nowrap shadow-sm">
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span class="text-white font-semibold">Activate</span>
        </button>

        <!-- 1B. Deactivate (When selected students are Active) -->
        <button type="button" id="bulk-btn-deactivate" onclick="openBulkDeactivateModal()"
            style="background-color: #d97706 !important; color: #ffffff !important;"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold hover:opacity-90 transition-all cursor-pointer whitespace-nowrap shadow-sm">
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" stroke-width="2"/><line x1="10" y1="15" x2="10" y2="9" stroke-width="2" stroke-linecap="round"/><line x1="14" y1="15" x2="14" y2="9" stroke-width="2" stroke-linecap="round"/></svg>
            <span class="text-white font-semibold">Deactivate</span>
        </button>

        <!-- 2. Permanent Delete (Hard Delete - School Admin Only) -->
        {% if is_admin %}
        <button type="button" onclick="openBulkDeleteModal()"
            style="background-color: #dc2626 !important; color: #ffffff !important;"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-semibold hover:opacity-90 transition-all cursor-pointer whitespace-nowrap shadow-sm">
            <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            <span class="text-white font-semibold">Permanent Delete</span>
        </button>
        {% endif %}

        <!-- 3. Exit / Cancel Mode -->
        <button type="button" onclick="exitStudentSelectionMode()"
            class="p-1.5 rounded-full text-gray-300 hover:text-white hover:bg-white/10 transition-colors cursor-pointer" title="Cancel Selection">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
</div>
{% endif %}

<!-- Students Table Live AJAX Container -->
<div id="students-table-container" class="scroll-mt-20">
    {% include 'students/partials/tab_students_table.html' %}
</div>
