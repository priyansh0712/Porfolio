<header class="bg-white/90 backdrop-blur-xl border-b border-[var(--apple-hairline)] sticky top-0 z-50 transition-all duration-200">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14 items-center">
            <!-- Brand -->
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl theme-bg-accent flex items-center justify-center text-white font-semibold text-sm shadow-sm">
                    S
                </div>
                <a href="{% url 'students:portal' %}" class="text-sm font-bold text-[var(--apple-ink)] tracking-tight hover:opacity-80 transition-opacity">
                    {% if request.tenant %}{{ request.tenant.name }}{% else %}StudentERP{% endif %}
                </a>
                <span class="hidden sm:inline-flex text-[11px] font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-200 shadow-sm">Student</span>
            </div>

            <!-- Right Actions -->
            <div class="flex items-center gap-3">
                <a href="{% url 'accounts:password_change' %}" class="text-xs font-semibold text-[var(--apple-ink)]/80 hover:text-[var(--apple-blue)] transition-colors px-1 py-1" title="Security & Password">🔒 Password</a>
                <a href="{% url 'accounts:logout' %}" class="inline-flex items-center text-xs font-semibold text-[var(--apple-ink)]/70 hover:text-rose-600 bg-[var(--apple-canvas)] hover:bg-rose-50 border border-[var(--apple-hairline)] hover:border-rose-200 rounded-full px-3.5 py-2 transition-all">
                    <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Sign Out
                </a>
            </div>
        </div>
    </div>
</header>
