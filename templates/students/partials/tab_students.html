<!-- Students Tab: Search bar + filters + responsive table -->

<!-- Search + Live Filters bar -->
<form method="GET" id="student-filter-form" action="{% url 'students:hub' %}" onsubmit="event.preventDefault(); triggerLiveStudentFilter();" class="bg-white rounded-2xl border border-gray-200/80 shadow-xs p-4 mb-4 flex flex-col md:flex-row md:items-end gap-3">
    <input type="hidden" name="tab" value="students">

    <!-- Search with Live Filter (Full width on mobile, expands on desktop) -->
    <div class="w-full md:flex-1 md:min-w-[220px]">
        <label class="block text-xs font-semibold text-gray-500 mb-1.5">Search</label>
        <div style="position: relative; display: flex; align-items: center; width: 100%;">
            <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; color: #9ca3af; display: flex; align-items: center;">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 115 11a6 6 0 0112 0z"/></svg>
            </div>
            <input type="text" name="q" id="student-search-input" value="{{ search }}" placeholder="Search by Name, GR No, Roll No…" autocomplete="off"
                style="padding-left: 36px !important; padding-right: 34px !important;"
                class="w-full py-2 text-sm rounded-xl border border-gray-300 focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 bg-white text-[#1D1D1F] placeholder:text-gray-400 transition-all leading-normal min-h-[42px] sm:min-h-[38px]">
            <button type="button" id="student-clear-search-btn" onclick="clearStudentSearch()"
               style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; border: none; background: transparent; padding: 0; {% if not search %}display: none;{% else %}display: flex;{% endif %} align-items: center; justify-content: center;"
               title="Clear search">
                <span class="w-5 h-5 flex items-center justify-center rounded-full hover:bg-gray-200 text-[10px] font-bold" style="background-color: #f3f4f6; color: #6b7280;">✕</span>
            </button>
        </div>
    </div>

    <!-- Filters container (Grid on mobile, flex on desktop) -->
    <div class="grid grid-cols-2 gap-3 w-full md:w-auto md:flex md:flex-row md:flex-nowrap md:items-end">
        {% if is_admin %}
        <!-- Standard filter -->
        <div class="w-full md:w-36">
            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Standard</label>
            <select name="standard" id="student-filter-standard" onchange="handleStandardFilterChange(this)"
                class="w-full rounded-xl border border-gray-300 px-3.5 py-2 text-sm focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 bg-white text-[#1D1D1F] cursor-pointer transition-all h-[40px] sm:h-[38px]">
                <option value="">All Standards</option>
                {% for s in standards %}
                <option value="{{ s.id }}" {% if request.GET.standard == s.id|stringformat:"s" %}selected{% endif %}>{{ s.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Division filter -->
        <div class="w-full md:w-36">
            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Division</label>
            <select name="division" id="student-filter-division"
                class="w-full rounded-xl border border-gray-300 px-3.5 py-2 text-sm focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 bg-white text-[#1D1D1F] cursor-pointer transition-all h-[40px] sm:h-[38px]">
                <option value="">All Divisions</option>
                {% for d in divisions %}
                <option value="{{ d.id }}" data-standard="{{ d.standard_id }}" data-name="{{ d.name }}" data-fullname="{{ d.standard.name }} — {{ d.name }}" {% if request.GET.division == d.id|stringformat:"s" %}selected{% endif %}>
                    {% if request.GET.standard == d.standard_id|stringformat:"s" %}Division {{ d.name }}{% else %}{{ d.standard.name }} — {{ d.name }}{% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <!-- Status filter -->
        <div class="w-full md:w-32">
            <label class="block text-xs font-semibold text-gray-500 mb-1.5">Status</label>
            <select name="status"
                class="w-full rounded-xl border border-gray-300 px-3.5 py-2 text-sm focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 bg-white text-[#1D1D1F] cursor-pointer transition-all h-[40px] sm:h-[38px]">
                <option value="active" {% if status_filter == 'active' or not status_filter and not show_inactive %}selected{% endif %}>Active</option>
                <option value="inactive" {% if status_filter == 'inactive' or show_inactive %}selected{% endif %}>Inactive</option>
                <option value="all" {% if status_filter == 'all' %}selected{% endif %}>All Students</option>
            </select>
        </div>

        <!-- Reset Button -->
        <div id="student-reset-btn-wrapper" class="w-full md:w-auto flex items-end" style="{% if not search and not request.GET.standard and not request.GET.division and status_filter != 'inactive' and status_filter != 'all' and not show_inactive %}display: none;{% endif %}">
            <button type="button" onclick="resetStudentFilters()" class="w-full md:w-auto inline-flex items-center justify-center text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 border border-red-200/80 rounded-xl px-4 py-2 transition-all h-[40px] sm:h-[38px] cursor-pointer" title="Reset all filters">
                Reset
            </button>
        </div>
    </div>
</form>

<!-- Students Table Live AJAX Container -->
<div id="students-table-container">
    {% include 'students/partials/tab_students_table.html' %}
</div>
